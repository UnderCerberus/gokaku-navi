<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOKAKU NAVI — 志望校逆算ダッシュボード</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/math.css">
<link rel="stylesheet" href="css/english.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">◢ GOKAKU NAVI</span><small>志望校逆算ダッシュボード</small></div>
  <div class="mini">
    <span class="mini-cd" id="miniCd"></span>
    <span class="mini-timer" id="miniTimer"><span class="pulse"></span>勉強中 <b id="miniClock">00:00:00</b></span>
    <button class="btn ghost sm" id="themeBtn" type="button">☀ ライト</button>
  </div>
</header>

<main class="wrap">
  <!-- 【1】志望校逆算・カウントダウンダッシュボード -->
  <section class="dash" aria-label="ダッシュボード">
    <div class="card" id="dProfile"></div>
    <div class="card cd" id="dCount"></div>
    <div class="card" id="dGap"></div>
  </section>
  <section class="dash-b">
    <div class="card" id="dNorma"></div>
    <div class="card" id="dTodo"></div>
    <div class="card" id="dStats"></div>
  </section>

  <!-- 【2】モード切替 & 勉強タイマー / 【5】3 教科タブ -->
  <section id="work">
    <div class="workbar">
      <div class="mode" role="group" aria-label="モード切替">
        <button type="button" id="modeExam" aria-pressed="false">過去問モード</button>
        <button type="button" id="modeCalc" aria-pressed="true">計算機モード</button>
      </div>
      <div class="timer hidden" id="timerBox" aria-label="勉強タイマー">
        <span class="pulse"></span><span class="small" id="tState">勉強中</span>
        <span class="t-clock" id="tClock">00:00:00</span>
        <button class="btn sm" id="tPause" type="button">一時停止</button>
        <button class="btn ghost sm" id="tReset" type="button" title="表示中のストップウォッチを 0 に戻します（記録済みの学習時間は消えません）">リセット</button>
        <span class="dim small" id="tToday"></span>
      </div>
      <span class="dim small" id="modeHint"></span>
      <nav class="tabs" role="tablist" aria-label="教科">
        <button class="tab" role="tab" data-subject="math" style="--sc:var(--s-math)"><i>∑</i>数学</button>
        <button class="tab" role="tab" data-subject="english" style="--sc:var(--s-english)"><i>Aa</i>英語</button>
        <button class="tab" role="tab" data-subject="physics" style="--sc:var(--s-physics)"><i>⚛</i>物理</button>
      </nav>
    </div>
    <div class="card stage" id="stage"></div>
  </section>
</main>
